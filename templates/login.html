<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PLANTERRAX - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { 
      margin:0; 
      padding:0; 
      box-sizing:border-box; 
    }
    
    body {
      font-family: 'VT323', monospace;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 40%, #8B7355 60%, #654321 100%);
      min-height:100vh; 
      display:flex; 
      justify-content:center; 
      align-items:center;
      margin:0;
      position: relative;
      overflow: hidden;
      image-rendering: pixelated;
    }

    /* Animated background elements */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.9;
      animation: float-cloud 25s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }

    .cloud1 {
      width: 80px;
      height: 30px;
      top: 10%;
      left: -100px;
    }

    .cloud1::before {
      width: 40px;
      height: 40px;
      top: -15px;
      left: 10px;
    }

    .cloud1::after {
      width: 50px;
      height: 35px;
      top: -10px;
      right: 10px;
    }

    .cloud2 {
      width: 100px;
      height: 35px;
      top: 20%;
      left: -150px;
      animation-delay: 12s;
    }

    .cloud2::before {
      width: 50px;
      height: 50px;
      top: -20px;
      left: 15px;
    }

    .cloud2::after {
      width: 60px;
      height: 40px;
      top: -15px;
      right: 15px;
    }

    @keyframes float-cloud {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 200px)); }
    }

    .sun {
      position: absolute;
      top: 50px;
      right: 10%;
      width: 60px;
      height: 60px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 20px #FFD700, 0 0 40px #FFA500;
      animation: pulse-sun 3s ease-in-out infinite;
    }

    @keyframes pulse-sun {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Login Container - Game Card Style */
    .login-container {
      background: #D2B48C;
      padding: 40px 35px;
      border: 6px solid #8B4513;
      border-radius: 15px;
      box-shadow: 8px 8px 0 #000;
      width: 420px;
      max-width: 90%;
      text-align: center;
      color: #2d5016;
      position: relative;
      z-index: 10;
      animation: slideDown 0.5s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(139, 69, 19, 0.1) 10px,
        rgba(139, 69, 19, 0.1) 20px
      );
      z-index: -1;
      border-radius: 15px;
    }

    /* Logo/Title Area */
    .login-header {
      margin-bottom: 30px;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      background: #2d5016;
      border: 4px solid #1a3009;
      border-radius: 10px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 4px 4px 0 #000;
    }

    .login-container h2 {
      font-family: 'Press Start 2P', cursive;
      margin-bottom: 10px;
      color: #2d5016;
      font-size: 1.8rem;
      text-shadow: 3px 3px 0 rgba(255,255,255,0.5);
    }

    .login-subtitle {
      font-size: 1.4rem;
      color: #654321;
      margin-bottom: 20px;
    }

    /* Error message styling */
    .error-message {
      background: #ff6b6b;
      color: white;
      padding: 12px;
      border: 3px solid #c92a2a;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 3px 3px 0 #000;
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    /* Input fields - Game style */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.9rem;
      color: #2d5016;
      margin-bottom: 8px;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    }

    .login-container input {
      width: 100%;
      padding: 15px;
      border: 4px solid #8B4513;
      border-radius: 8px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      outline: none;
      transition: all 0.2s;
      background: #F5DEB3;
      color: #2d5016;
      box-shadow: inset 3px 3px 0 rgba(0,0,0,0.2);
    }

    .login-container input:focus {
      border-color: #4CAF50;
      background: #FFF8DC;
      box-shadow: inset 3px 3px 0 rgba(0,0,0,0.2), 0 0 0 3px rgba(76, 175, 80, 0.3);
    }

    .login-container input::placeholder {
      color: #8B7355;
    }

    /* Button - Game style */
    .login-container button {
      width: 100%;
      padding: 18px;
      margin-top: 10px;
      border: 4px solid #FFA500;
      border-radius: 8px;
      background: #FFD700;
      color: #2d5016;
      font-family: 'Press Start 2P', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 5px 5px 0 #000;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    }

    .login-container button:hover {
      background: #FFA500;
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 #000;
    }

    .login-container button:active {
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #000;
    }

    /* Links - Game style */
    .login-links {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-container a {
      display: inline-block;
      font-size: 1.3rem;
      color: #2d5016;
      text-decoration: none;
      transition: all 0.2s;
      padding: 10px;
      background: rgba(139, 69, 19, 0.2);
      border: 3px solid #8B4513;
      border-radius: 8px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    }

    .login-container a:hover {
      color: #4CAF50;
      background: rgba(76, 175, 80, 0.2);
      border-color: #4CAF50;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
    }

    .login-container a:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    /* Divider */
    .divider {
      margin: 20px 0;
      height: 3px;
      background: #8B4513;
      border-radius: 2px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 25px;
        width: 95%;
      }

      .login-container h2 {
        font-size: 1.3rem;
      }

      .login-container button {
        font-size: 1rem;
        padding: 15px;
      }

      .input-label {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="sun"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">🌱</div>
      <h2>PLANTERRAX</h2>
      <div class="login-subtitle">Player Login</div>
    </div>

    {% if wrong %}
    <div class="error-message">
      ⚠️ {{ wrong }}
    </div>
    {% endif %}
    
    <form action="/login" method="post">
      <div class="input-group">
        <label class="input-label" for="username">USERNAME</label>
        <input name="usr" id="username" type="text" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label class="input-label" for="password">PASSWORD</label>
        <input name="passw" id="password" type="password" placeholder="Enter your password" required>
      </div>

      <label><input type="checkbox" name="remember"> Remember me</label>


      <button type="submit">START GAME</button>

      <div class="divider"></div>

      <div class="login-links">
        <a href="forget_password">🔑 Forgot Password?</a>
        <a href="signup">✨ Create New Account</a>
      </div>
    </form>
  </div>

  <script>
    // Add enter key support
    document.addEventListener('DOMContentLoaded', function() {
      const inputs = document.querySelectorAll('input');
      inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            const form = this.closest('form');
            form.submit();
          }
        });
      });
    });
  </script>
</body>
</html>
