<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANTERRAX - Farm Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 50%, #8B7355 100%);
            height: 100vh;
            overflow: hidden;
            image-rendering: pixelated;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Animated background */
        .cloud {
            position: fixed;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
            animation: float-cloud 25s linear infinite;
            z-index: 1;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud1 {
            width: 80px;
            height: 30px;
            top: 10%;
            left: -100px;
        }

        .cloud1::before {
            width: 40px;
            height: 40px;
            top: -15px;
            left: 10px;
        }

        .cloud1::after {
            width: 50px;
            height: 35px;
            top: -10px;
            right: 10px;
        }

        @keyframes float-cloud {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 200px)); }
        }

        .sun {
            position: fixed;
            top: 30px;
            right: 10%;
            width: 60px;
            height: 60px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 20px #FFD700, 0 0 40px #FFA500;
            animation: pulse-sun 3s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes pulse-sun {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Chatbot Container */
        .chatbot-container {
            width: 90%;
            max-width: 800px;
            height: 85vh;
            background: #D2B48C;
            border: 6px solid #8B4513;
            border-radius: 15px;
            box-shadow: 10px 10px 0 #000;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .chatbot-container::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(139, 69, 19, 0.1) 10px, rgba(139, 69, 19, 0.1) 20px);
            z-index: -1;
            border-radius: 15px;
        }

        /* Header */
        .chat-header {
            background: #2d5016;
            border-bottom: 4px solid #1a3009;
            padding: 20px;
            border-radius: 9px 9px 0 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bot-avatar {
            width: 60px;
            height: 60px;
            background: #8B4513;
            border: 4px solid #654321;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 3px 3px 0 #000;
        }

        .bot-info {
            flex: 1;
        }

        .bot-name {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3rem;
            color: #90EE90;
            text-shadow: 2px 2px 0 #000;
            margin-bottom: 5px;
        }

        .bot-status {
            font-size: 1.2rem;
            color: #FFD700;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            background: #ff6b6b;
            border: 3px solid #c92a2a;
            border-radius: 5px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #000;
        }

        .close-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #000;
        }

        /* Chat Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #F5DEB3;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 12px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #D2B48C;
            border: 2px solid #8B4513;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #8B4513;
            border: 2px solid #654321;
            border-radius: 5px;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            gap: 10px;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 45px;
            height: 45px;
            background: #2d5016;
            border: 3px solid #1a3009;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 3px 3px 0 #000;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #4CAF50;
            border-color: #2d5016;
        }

        .message-content {
            max-width: 70%;
            background: white;
            padding: 15px;
            border: 4px solid #8B4513;
            border-radius: 10px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            font-size: 1.4rem;
            line-height: 1.6;
            color: #2d5016;
        }

        .message.user .message-content {
            background: #90EE90;
            border-color: #4CAF50;
        }

        .message-time {
            font-size: 1rem;
            color: #654321;
            margin-top: 5px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 15px;
            background: white;
            border: 4px solid #8B4513;
            border-radius: 10px;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        .typing-dot {
            width: 10px;
            height: 10px;
            background: #2d5016;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* Input Area */
        .chat-input-area {
            background: #2d5016;
            border-top: 4px solid #1a3009;
            padding: 20px;
            display: flex;
            gap: 15px;
            border-radius: 0 0 9px 9px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            background: #F5DEB3;
            border: 4px solid #8B4513;
            border-radius: 8px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #2d5016;
            outline: none;
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.2);
            resize: none;
        }

        .chat-input:focus {
            border-color: #4CAF50;
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.2), 0 0 0 3px rgba(76, 175, 80, 0.3);
        }

        .send-btn {
            padding: 15px 30px;
            background: #FFD700;
            border: 4px solid #FFA500;
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #2d5016;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
            white-space: nowrap;
        }

        .send-btn:hover {
            background: #FFA500;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .send-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .send-btn:disabled {
            background: #A9A9A9;
            border-color: #696969;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Quick Actions */
        .quick-actions {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .chatbot-container {
                width: 95%;
                height: 90vh;
            }

            .bot-name {
                font-size: 1rem;
            }

            .message-content {
                max-width: 85%;
                font-size: 1.2rem;
            }

            .send-btn {
                padding: 15px 20px;
                font-size: 0.8rem;
            }

            .quick-actions {
                padding: 0 15px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="cloud cloud1"></div>
    <div class="sun"></div>

    <div class="chatbot-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="bot-avatar">🤖</div>
            <div class="bot-info">
                <div class="bot-name">FARM ASSISTANT</div>
                <div class="bot-status">Online - Ready to help!</div>
            </div>
            <button class="close-btn" onclick="window.location.href='/'">✕</button>
        </div>



        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome Message -->
            <div class="message bot">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    Welcome to PLANTERRAX Farm Assistant! I can help you with NASA satellite data, weather patterns, soil analysis, and farming tips. How can I help you today?
                    <div class="message-time">Just now</div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div class="message bot typing-indicator" id="typingIndicator">
                <div class="message-avatar">🤖</div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <textarea 
                class="chat-input" 
                id="chatInput" 
                placeholder="Ask about farming, weather, or NASA data..."
                rows="1"
                maxlength="500"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // Send on Enter (but Shift+Enter for new line)
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // Show typing indicator
            typingIndicator.classList.add('active');
            scrollToBottom();

            // Send message to Flask backend
            fetch('/chatbot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                typingIndicator.classList.remove('active');
                // Add bot response from Flask
                addMessage(data.response || 'Sorry, I encountered an error. Please try again.', 'bot');
            })
            .catch(error => {
                typingIndicator.classList.remove('active');
                addMessage('Sorry, I am having trouble connecting. Please try again later.', 'bot');
                console.error('Error:', error);
            });
        }

        function sendQuickMessage(message) {
            chatInput.value = message;
            sendMessage();
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            const avatar = sender === 'bot' ? '🤖' : '👤';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    ${text}
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            chatMessages.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Dummy bot responses - REMOVE THIS FUNCTION when using Flask
        function getBotResponse(message) {
            // This function is not used anymore - keeping for reference only
            return '';
        }

        // Initial scroll
        scrollToBottom();
    </script>
</body>
</html>
